pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx}'
      run: bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files} && git add {staged_files}
    fmt:
      glob: '*.{ts,tsx}'
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files} && git add {staged_files}
